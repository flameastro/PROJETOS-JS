<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lexend:wght@100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Space+Grotesk:wght@300..700&family=Tilt+Warp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <title>Meus Filmes Favoritos</title>
</head>
<body>
    <main>
        <h1>Meus Filmes Favoritos</h1>

        <section class="data">
            <div class="mb-3">
                <label for="title">Título do Filme</label>
                <input type="text" class="form-control" name="title" id="title" placeholder="Título do filme">
            </div>

            <div class="mb-3">
                <label for="gender">Gênero</label>
                <input type="text" class="form-control" name="gender" id="gender" placeholder="Gênero do filme">
            </div>

            <div class="mb-3">
                <label for="grade">Avaliação</label>
                <input type="number" class="form-control" name="grade" id="grade" placeholder="Uma nota de 1-5 estrelas para o filme">
            </div>

            <div>
                <button type="button" class="add btn btn-primary"><span class="material-symbols-outlined reajust">add</span>Adicionar</button>
            </div>
        </section>

        <section class="results">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Título</th>
                        <th scope="col">Gênero</th>
                        <th scope="col">Avaliação</th>
                        <th scope="col">Opções</th>
                    </tr>
                </thead>
                <tbody class="table-add">
                    <!-- data -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
