<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Descubra o Número</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lexend:wght@100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Space+Grotesk:wght@300..700&family=Tilt+Warp&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-archivo: "Archivo", sans-serif;
            --font-bricolage: "Bricolage Grotesque", sans-serif;
            --font-dm-sans: "DM Sans", sans-serif;
            --font-jetbrains: "JetBrains Mono", monospace;
            --font-lexend: "Lexend", sans-serif;
            --font-manrope: "Manrope", sans-serif;
            --font-outfit: "Outfit", sans-serif;
            --font-space: "Space Grotesk", sans-serif;
            --font-tilt: "Tilt Warp", sans-serif;
        }

        h1 {
            font-family: var(--font-outfit);
        }

        main, button {
            font-family: var(--font-space);
        }

        input {
            font-family: var(--font-manrope);
        }

        main, .data div, .result {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data div {
            margin-bottom: 10px;
        }

        .results {
            margin: 5px;
        }

        .results p {
            margin: 2.5px;
            padding: 0;
        }

        button {
            background-color: whitesmoke;
            border: 1.5px solid black;
            border-radius: 4.5px;
            padding: 5px 10px;
            transition: all 0.25s ease-in-out;
            width: 175px;
            margin: 2px;
        }

        button:hover {
            background-color: rgb(58, 58, 58);
            color: whitesmoke;
        }

        button:active {
            background-color: rgb(134, 134, 134);
        }

        .reset {
            display: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Jogo Descubra o Número</h1>

        <section class="data">
            <form>
                <div>
                    <label for="number">Número (1-100)</label>
                    <input type="number" name="number" id="number">
                </div>

                <div>
                    <button class="bet">Apostar</button>
                    <button class="reset">Reiniciar</button>
                </div>
            </form>
        </section>

        <section class="results">
            <p class="attempts">Tentativas: 0</p>
        </section>

        <section class="feedback"><span></span></section>
    </main>

    <script>
        const computerNumber = Math.floor(Math.random() * 100) + 1
        const feedback = document.querySelector(".feedback > span")

        let attemptsElement = document.querySelector(".attempts")
        let attempts = 0

        const bet = document.querySelector(".bet")
        bet.addEventListener("click", (evt) => {
            evt.preventDefault()

            const number = Number(document.querySelector("#number").value)
            if (number > 0 && number <= 100) {
                attempts++

                if (number === computerNumber) {
                    feedback.innerText = `Você acertou! Número: ${number}`
                    document.querySelector(".reset").style.display = "inline-block"
                } else if (number > computerNumber) {
                    feedback.innerText = "Aposta alta! Tente diminuir!"
                } else {
                    feedback.innerText = "Aposta baixa! Tente aumentar!"
                }

                attemptsElement.innerText = `Tentativas: ${attempts}`
            } else {
                alert("Aposta inválida, tente outro número.")
            }
        })

        const reset = document.querySelector(".reset")
        reset.addEventListener("click", (evt) => {
            evt.preventDefault()

            location.reload()
        })
    </script>
</body>
</html>
